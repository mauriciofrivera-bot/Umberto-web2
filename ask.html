<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ask Me Anything | Umberto Campioni</title>
    
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dorado: #b58d52;
            --dorado-brillante: #e0b36e;
            --oscuro-puro: #000000;
            --blanco: #ffffff;
            --gris-linea: #444444;
            --gris-texto: #888888;
            --gris-labels: #cccccc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--oscuro-puro);
            color: var(--blanco);
            font-family: 'EB Garamond', serif; /* Actualizado a Serif */
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 25px;
            gap: 30px;
            border-bottom: 1px solid #111;
        }

        nav a {
            color: var(--blanco);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .ask-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .ask-header h1 {
            font-family: 'Playfair Display', serif; /* Actualizado a Serif */
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: var(--dorado);
            margin: 0 auto 20px;
        }

        .intro-text {
            font-size: 1.1rem;
            color: var(--gris-texto);
            font-style: italic;
        }

        .form-wrapper {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 40px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gris-labels);
            margin-bottom: 10px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: #111111;
            border: 1px solid var(--gris-linea);
            color: var(--blanco);
            padding: 15px;
            font-family: 'EB Garamond', serif; /* Actualizado a Serif */
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--dorado);
        }

        .btn-submit {
            width: 100%;
            background: var(--dorado);
            color: var(--oscuro-puro);
            border: none;
            padding: 16px;
            font-family: 'EB Garamond', serif; /* Actualizado a Serif */
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: var(--dorado-brillante);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #444;
            font-size: 0.7rem;
            letter-spacing: 1px;
            border-top: 1px solid #111;
            margin-top: 60px;
        }

        @media (max-width: 480px) {
            .ask-header h1 { font-size: 2.2rem; }
            .form-wrapper { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Journal</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <header class="ask-header">
            <h1>Ask Me Anything</h1>
            <div class="divider"></div>
            <p class="intro-text">Unfiltered insights into the world of wine, service, and hospitality.</p>
        </header>

        <div class="form-wrapper">
            <form name="ask-anything" method="POST" data-netlify=\"true\" action="/success.html">
                <input type="hidden" name="form-name" value="ask-anything" />
                
                <div class="input-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required placeholder="How should I address you?">
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="Where should I send the answer?">
                </div>

                <div class="input-group">
                    <label>Your Question</label>
                    <textarea name="question" rows="5" required placeholder="Ask about a specific bottle, region, or industry secret..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Question</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 UMBERTO CAMPIONI. BUILT BY RIVERA ENGINEERING.
    </footer>

</body>
</html>
