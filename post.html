<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal | Umberto Campioni</title>
    
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

    <style>
        :root {
            --dorado: #b58d52;
            --oscuro: #0a0a0a;
            --blanco: #f0f0f0;
            --gris-texto: #d1d1d1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background-color: var(--oscuro); 
            color: var(--blanco); 
            font-family: 'EB Garamond', serif; /* Actualizado a Serif */
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        nav { display: flex; justify-content: center; padding: 25px; gap: 30px; border-bottom: 1px solid #111; }
        nav a { color: var(--blanco); text-decoration: none; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; }

        .post-container { max-width: 700px; margin: 0 auto; padding: 60px 20px 100px; }
        
        .back-link { display: inline-block; color: var(--dorado); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 40px; font-weight: bold; }
        
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; line-height: 1.2; margin-bottom: 30px; font-weight: normal; } /* Actualizado a Serif */
        
        .image-wrapper { width: 100%; margin-bottom: 40px; display: none; background: #080808; border: 1px solid #111; }
        .image-wrapper img { width: 100%; height: auto; display: block; object-fit: cover; max-height: 450px; }

        .content { font-size: 1.1rem; color: var(--gris-texto); }
        .content p { margin-bottom: 25px; text-align: justify; }
        .content h2, .content h3 { font-family: 'Playfair Display', serif; color: var(--blanco); margin: 40px 0 20px; font-weight: normal; } /* Actualizado a Serif */
        .content h2 { font-size: 1.8rem; }
        .content blockquote { border-left: 2px solid var(--dorado); padding-left: 20px; font-style: italic; color: var(--dorado); margin: 30px 0; }

        /* Estilos Disqus */
        #disqus_thread { margin-top: 80px; padding-top: 40px; border-top: 1px solid #151515; }

        footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.7rem; letter-spacing: 1px; border-top: 1px solid #111; margin-top: 80px; }
        
        @media (max-width: 600px) { h1 { font-size: 2.2rem; } .content { font-size: 1.05rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Journal</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="post-container">
        <a href="blog.html" class="back-link">← Back to Journal</a>
        <h1 id="post-title">Loading article...</h1>
        
        <div class="image-wrapper" id="img-wrapper">
            <img id="post-image" src="" alt="">
        </div>

        <article class="content" id="post-content">
            </article>

        <div id="disqus_thread"></div>
    </main>

    <footer>
        &copy; 2026 UMBERTO CAMPIONI. BUILT BY RIVERA ENGINEERING.
    </footer>

    <script>
        const USER = "Arthemis80";
        const REPO = "umberto-sommelier";

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        async function loadPost() {
            const fileName = getParam('post');
            if (!fileName) {
                document.getElementById('post-title').innerText = "Artículo no encontrado";
                return;
            }

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/_posts/${fileName}`);
                if (!res.ok) throw new Error();
                const text = await res.text();

                const parts = text.split('---');
                if (parts.length >= 3) {
                    const meta = jsyaml.load(parts[1]);
                    document.getElementById('post-title').innerText = meta.title;

                    if (meta.thumbnail) {
                        const img = document.getElementById('post-image');
                        const wrapper = document.getElementById('img-wrapper');
                        const fileNameOnly = meta.thumbnail.split('/').pop();
                        img.src = `images/blog/${fileNameOnly}`;
                        wrapper.style.display = 'block';
                        img.onerror = () => img.src = `https://raw.githubusercontent.com/${USER}/${REPO}/main/images/blog/${fileNameOnly}`;
                    }

                    document.getElementById('post-content').innerHTML = marked.parse(parts.slice(2).join('---'));
                    
                    var disqus_config = function () {
                        this.page.url = window.location.href;
                        this.page.identifier = fileName;
                    };
                    var d = document, s = d.createElement('script');
                    s.src = 'https://umberto-sommelier.disqus.com/embed.js';
                    s.setAttribute('data-timestamp', +new Date());
                    (d.head || d.body).appendChild(s);
                }
            } catch (err) { console.error(err); }
        }
        window.onload = loadPost;
    </script>
</body>
</html>
